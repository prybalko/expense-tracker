services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      # Persist expenses.db across rebuilds — the SQLite file lives in ./data
      # on the host so `docker-compose up --build` does not lose user data.
      - ./data:/app/data
    ports:
      - "8080:8080"
    environment:
      - DB_PATH=/app/data/expenses.db
    restart: unless-stopped
